name = "agent-broker-edge"
main = "src/index.ts"
compatibility_date = "2025-11-01"
compatibility_flags = ["nodejs_compat"]

# Public-facing settings (non-secret) live in vars
[vars]
ORIGIN_URL = "https://smb-broker.onrender.com"
EDGE_VERSION = "0.1.0"
SERVICE_NAME = "agent-broker"

# KV cache for discovery payloads
[[kv_namespaces]]
binding = "CACHE"
id = "f45691e20cdd4937ae88ccb64159d928"

# Observability (free)
[observability]
enabled = true
head_sampling_rate = 1

# Cron fires every 5 min so the Render free-tier dyno (15-min idle timeout)
# stays warm. The handler keeps KV refreshes — which DO count against the
# 1k writes/day free-tier cap — gated to every 30th minute so the daily
# write budget stays around 12 paths × 48 refreshes = 576 writes/day.
[triggers]
crons = ["*/5 * * * *"]

# Allow importing .txt and .yaml as raw strings (snapshots embedded in bundle).
[[rules]]
type = "Text"
globs = ["**/*.txt", "**/*.yaml"]
fallthrough = true

name = "agent-broker-edge"
main = "src/index.ts"
compatibility_date = "2025-11-01"
compatibility_flags = ["nodejs_compat"]
# basil-agent account ("ancient-poetry-7583") — the account that serves the
# Smithery-listed URL. Access recovered 2026-08-23 (CF_API_TOKEN in ../.env).
# The 2026-08-13 deploy to the techmate account (8f0ebd00...) is an orphaned
# duplicate and is no longer the deploy target.
account_id = "4996b77206796d62ffa870cdd6e5c4f5"

# Public-facing settings (non-secret) live in vars
[vars]
ORIGIN_URL = "https://smb-broker.onrender.com"
EDGE_VERSION = "0.1.0"
SERVICE_NAME = "agent-broker"

# Secrets (NOT declared here — set via `wrangler secret put`):
#   TELEGRAM_BOT_TOKEN  → Telegram bot token from @BotFather. When unset the
#                         cron alert subsystem (src/alerts.ts) silently
#                         no-ops, so the worker still runs without it.
#   TELEGRAM_CHAT_ID    → Numeric chat id (or @channel handle) that receives
#                         Basil's alerts: first-revenue, low Twilio/Vapi
#                         balance, and traffic milestones.
#   X402_RECEIVER_ADDRESS → Ethereum address (0x…40hex) that receives USDC
#                         micropayments on Base from x402-capable AI agents.
#                         When UNSET, the worker behaves exactly as it does
#                         today: tools/call is proxied straight to origin and
#                         only the Paddle subscription path applies. When set,
#                         tools/call demands an x402 payment proof (USDC on
#                         Base) per call — see src/x402.ts for the price table.
#                         Set with: wrangler secret put X402_RECEIVER_ADDRESS

# KV cache for discovery payloads
[[kv_namespaces]]
binding = "CACHE"
id = "f45691e20cdd4937ae88ccb64159d928"

# Observability (free)
[observability]
enabled = true
head_sampling_rate = 1

# Cron fires every 5 min so the Render free-tier dyno (15-min idle timeout)
# stays warm. The handler keeps KV refreshes — which DO count against the
# 1k writes/day free-tier cap — gated to every 30th minute so the daily
# write budget stays around 12 paths × 48 refreshes = 576 writes/day.
[triggers]
crons = ["*/5 * * * *"]

# ---------------------------------------------------------------------------
# FREEMIUM RATE-LIMIT (added 2026-08-13)
# ---------------------------------------------------------------------------
# Rate-limiting uses the existing CACHE KV namespace — no new bindings needed.
# Free tier: 100 tools/call ops / IP / day; 429 response includes Polar link.
# Polar product: $49/mo — https://buy.polar.sh/polar_cl_zRn6I67zMjFuenkjDme5RCnDYmA3vefHqX1zG3A5Phh
#
# To deploy this change:
#   cd agentbroker\edge
#   npx wrangler deploy
# ---------------------------------------------------------------------------

# Allow importing .txt and .yaml as raw strings (snapshots embedded in bundle).
[[rules]]
type = "Text"
globs = ["**/*.txt", "**/*.yaml"]
fallthrough = true

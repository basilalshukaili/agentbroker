name: Deploy to Fly.io

on:
  push:
    branches: [main]
  workflow_dispatch:    # allow manual trigger from GitHub UI

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest tests/ -q

  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    needs: test
    concurrency:
      group: deploy-fly
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        run: flyctl deploy --config deploy/fly.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  smoke:
    name: Post-deploy smoke test
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Wait for app to be ready
        run: sleep 20
      - name: Hit health endpoint
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS https://agentbroker.qzz.io/health; then exit 0; fi
            echo "retry $i..."; sleep 10
          done
          exit 1
      - name: Hit MCP tools/list
        run: |
          curl -fsS -X POST https://agentbroker.qzz.io/mcp \
            -H "Content-Type: application/json" \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' | grep -q "find_business"

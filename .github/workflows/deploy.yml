name: CI + smoke

# Lightweight CI: runs tests on every push so Koyeb's auto-deploy
# only picks up commits that pass tests. Koyeb itself handles the
# build + deploy via its GitHub integration — no deploy step needed here.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Tests + self-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run unit + contract + compliance + fault-injection tests
        run: pytest tests/ -q
      - name: Validate manifest + MCP server + discovery surfaces
        run: |
          python -c "
          import asyncio
          from agent_interface.manifest_server import get_full_manifest
          from agent_interface.mcp_server import handle_mcp_request
          from agent_interface.well_known import get_llms_txt
          assert len(get_full_manifest()['operations']) == 13, 'manifest must define 13 operations'
          r = asyncio.run(handle_mcp_request({'jsonrpc':'2.0','id':1,'method':'tools/list','params':{}}))
          assert len(r['result']['tools']) == 13, 'MCP must expose 13 tools'
          assert 'find_business' in get_llms_txt(), 'llms.txt must include all operations'
          print('All checks passed.')
          "

  smoke:
    name: Post-deploy smoke
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Wait for Koyeb to redeploy
        run: sleep 120
      - name: Hit /health on production domain
        continue-on-error: true   # don't fail the workflow if domain not yet propagated
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS https://agent-broker-edge.basil-agent.workers.dev/health; then echo; exit 0; fi
            echo "retry $i..."; sleep 30
          done
          echo "Health check did not pass — verify Koyeb dashboard manually."
          exit 0
      - name: Hit MCP tools/list
        continue-on-error: true
        run: |
          curl -fsS -X POST https://agent-broker-edge.basil-agent.workers.dev/mcp \
            -H "Content-Type: application/json" \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' | grep -q "find_business" \
          && echo "MCP responding correctly" \
          || echo "MCP smoke skipped (check Koyeb dashboard)"

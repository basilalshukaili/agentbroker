name: Publish to MCP Registry

# Publishes server.json to the official MCP Registry (registry.modelcontextprotocol.io)
# for the dev.hatchloop/* namespace using DNS auth. hatchloop.dev is DNS-verified;
# the Ed25519 private key lives in the MCP_REGISTRY_DNS_KEY repo secret.
#
# Why DNS and not GitHub OIDC: OIDC can only claim the io.github.<owner>/* namespace
# (the reverse-DNS name we deliberately moved off). Our published name is
# dev.hatchloop/agent-broker, which requires DNS-verified auth.
#
# Auto-runs whenever server.json changes on main (bump the "version" field on each
# change — the registry rejects a duplicate version), or on manual dispatch. Keeping
# this entry current is the single upstream lever: directories that aggregate from the
# official registry pick the change up automatically.

on:
  push:
    branches: [main]
    paths: ["server.json", "registry/*/server.json"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      # RETRY, BECAUSE VALIDATION IS A NETWORK CALL TO SOMEONE ELSE'S SERVER.
      #
      # `mcp-publisher validate` POSTs to registry.modelcontextprotocol.io. On
      # 2026-08-29 that call timed out at the TCP layer and failed the whole
      # publish - our manifests were fine, the registry was simply unreachable
      # for thirty seconds. The founder gets an email for every red run here, so
      # an upstream blip costs a real interruption and teaches everyone to
      # ignore this workflow's failures.
      #
      # Three attempts with backoff. A manifest that is genuinely INVALID still
      # fails all three and still fails the build - this only absorbs the case
      # where we never got an answer.
      - name: Validate every manifest
        run: |
          set -e
          for f in server.json registry/*/server.json; do
            echo "validating $f"
            for attempt in 1 2 3; do
              if (cd "$(dirname "$f")" && "$OLDPWD/mcp-publisher" validate); then
                break
              fi
              if [ "$attempt" = "3" ]; then
                echo "validation failed three times for $f - failing the build"
                exit 1
              fi
              echo "  attempt $attempt failed; retrying in $((attempt * 10))s"
              sleep $((attempt * 10))
            done
          done

      - name: Authenticate (DNS — dev.hatchloop namespace)
        run: ./mcp-publisher login dns --domain hatchloop.dev --private-key "${{ secrets.MCP_REGISTRY_DNS_KEY }}"

      # CAPABILITY-SCOPED ENTRIES, one per thing an agent actually searches for.
      #
      # The registry matches server NAMES, not descriptions. Searched for
      # "sanctions" or "booking" we did not appear at all, while competitors who
      # own those names did. These were held back for a day out of a concern
      # that near-duplicate entries read as spam - the policy's example is "the
      # same server submitted multiple times under different names".
      #
      # That concern was WRONG, and the evidence is observable rather than
      # interpretive: the same policy explicitly will NOT remove "servers that
      # do the same thing as other servers", and io.github.pipeworx-io publishes
      # DOZENS of capability-named servers, all active, all served from one
      # gateway at /<name>/mcp - the identical architecture. None removed.
      #
      # The one thing that WOULD have made ours look like duplicates is fixed
      # first: each door's `initialize` now returns its own serverInfo and its
      # own tool count, rather than announcing itself as the 20-tool server.
      #
      # Each entry is published from its own directory because mcp-publisher
      # reads ./server.json.
      # AN ALREADY-PUBLISHED VERSION IS A SKIP, NOT A FAILURE.
      #
      # This workflow fires whenever ANY manifest changes, and then walks all of
      # them - so the unchanged ones are duplicates by definition. The first run
      # died on the root server.json ("cannot publish duplicate version") under
      # `set -e` and never reached the two NEW entries it existed to publish.
      # Publishing has to be idempotent or adding the fourth manifest breaks the
      # other three.
      #
      # Every other error still fails the build. "Already published" is the one
      # outcome that means the desired state is already true.
      - name: Publish every manifest
        run: |
          set -uo pipefail
          failed=0
          for f in server.json registry/*/server.json; do
            name=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['name'])" "$f")
            echo "--- $name ($f)"
            out=$(cd "$(dirname "$f")" && "$OLDPWD/mcp-publisher" publish 2>&1) || true
            echo "$out"
            if echo "$out" | grep -q "duplicate version"; then
              echo "    already published at this version - skipping"
            elif echo "$out" | grep -qiE "^Error:|status [45][0-9][0-9]"; then
              echo "    FAILED"
              failed=1
            fi
          done
          exit $failed

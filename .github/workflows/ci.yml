# The gates, actually running.
#
# WHY THIS FILE EXISTS. A complete seven-stage pipeline has been sitting in
# `.ci/github-actions.yml` this whole time - lint, unit, compliance, contract,
# fault-injection, a win-rate gate, a docker self-test and a deploy gate.
# GitHub only runs workflows under `.github/workflows/`, so none of THOSE
# stages ever executed.
#
# BUT THE FIRST VERSION OF THIS FILE OVERSTATED IT, and the correction belongs
# at the top rather than buried. It said no CI had ever run. That was wrong and
# I should have looked before claiming it: `deploy.yml` was named "CI + smoke"
# and had been running the full pytest suite plus manifest and MCP validation
# on every push, then smoke-testing production afterwards.
#
# What genuinely never ran were the GATE SCRIPTS - check_gates, check_pricing,
# check_encoding - which existed only inside that unreachable `.ci/` file. So
# "the tests never ran" was false; "our own guard scripts only ran when a human
# remembered" was true, and that is the part worth fixing.
#
# A claim about what does not run, made without checking what does, is the same
# carelessness this pipeline exists to catch.
#
# The two workflows have now been merged into this one, because running the
# same 900-test suite twice on every push doubled the queue for no benefit -
# and with GitHub's runners backed up this afternoon, that duplication was
# delaying the deploys it was supposed to protect.
#
# WHY THIS IS SHORTER THAN THE FILE IT REPLACES. Every gate below was run
# locally first and is green right now. A pipeline that fails on its first run
# gets switched off within a week, and then we are back here with an extra
# layer of false confidence. Stages are added to this file only after they pass
# - `.ci/github-actions.yml` stays as the roadmap for what to add next (ruff
# and mypy in particular, neither of which is installed or verified here).

name: CI

on:
  push:
    branches: [main, "node-b/**"]
  pull_request:
    branches: [main]

# ─── THE TWO SETTINGS BELOW EXIST BECAUSE THEIR ABSENCE WEDGED THE PIPELINE ───
#
# On 2026-08-29 CI stopped running entirely for five hours. It looked exactly
# like a GitHub outage - runs queued, nothing executing, status page green - and
# it was diagnosed as one, which is why four commits shipped on a local-only
# override that afternoon.
#
# It was ours. Twenty `deploy.yml` runs were stuck `in_progress`, each with a
# runner assigned and `updated_at` frozen four seconds after it started. Twenty
# is exactly the concurrent-job cap for a public repo on the free plan, so those
# zombies held every slot and everything else queued behind them for ever.
# Cancelling them drained the queue within a minute.
#
# Neither default protects against that:
#
#   * a job with no `timeout-minutes` inherits SIX HOURS, so one hung job holds
#     a slot for a working day;
#   * with no `concurrency` group, every push adds a run and superseded runs
#     keep occupying slots while newer commits wait behind them.
#
# The lesson generalises past CI, and it is the same one this repo keeps
# relearning: "nothing is running" was read as an outage because that was the
# comfortable reading. The queue said 20/20 the whole time - nobody looked.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests and gates
    runs-on: ubuntu-latest
    # The suite runs in ~50s locally and a few minutes here. Twenty is generous
    # for a slow runner and still fails fast enough that a hang is visible in
    # the same session that caused it.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # MATCH THE PRODUCTION IMAGE, not the newest Python.
          # The Dockerfile runs python:3.11-slim. While this said 3.12,
          # a backslash inside an f-string expression - legal in 3.12,
          # a SyntaxError in 3.11 - passed every gate and then crashed
          # the container on four consecutive deploys, each reported as
          # a failed deploy with a perfectly successful build.
          # scripts/check_py311_compatible.py fails if these two drift
          # apart again.
          python-version: "3.11"

      # The FULL requirements file, deliberately. Installing a subset is how a
      # test came to be skipped for a missing dependency for weeks while being
      # counted in a total quoted as "816 passed" - it failed twice over the
      # first time it actually ran, and it was guarding the rule that an
      # unprovisioned booking must never return a fabricated confirmation.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # pytest-timeout is a CI-only diagnostic, deliberately not in
          # requirements.txt - it must not ship in the production image.
          pip install pytest-timeout

      # Fails rather than skips when a gating dependency is absent, so CI can
      # never quietly run a smaller suite than it reports.
      - name: Suite is fully exercised
        run: python -m pytest tests/unit/test_suite_is_fully_exercised.py -q

      # --timeout NAMES THE HANG INSTEAD OF SWALLOWING IT.
      #
      # On 2026-09-02 three runs in a row died at exactly twenty minutes with
      # the single word "cancelled", which is how GitHub reports a job hitting
      # timeout-minutes. Nothing said which test, because -q prints a dot per
      # test and the job is killed before pytest writes its summary - so the
      # only evidence of a twenty-minute hang was its duration.
      #
      # The trigger was pinning this job to Python 3.11 to match the
      # production image (the previous run, on 3.12, was green). Something in
      # the suite blocks on 3.11 and not on 3.12, and finding it by pushing
      # commits blind costs twenty minutes an attempt.
      #
      # thread method dumps the stack of the STUCK test rather than only
      # failing it, which is the difference between "a test hangs" and knowing
      # the line. 120s is many times the slowest legitimate test here.
      - name: Tests
        run: python -m pytest tests/ -q --timeout=120 --timeout-method=thread

      # 17 release gates - the manifest/pricing/compliance invariants.
      - name: Release gates
        run: python check_gates.py

      # Public artifacts must not carry retired pricing or a payment rail we do
      # not offer. This one has real history: it reported CLEAN while three
      # files carried live crypto offers, because it matched the exact old
      # wording and "may ALSO pay" walked straight past it.
      - name: No retired pricing or unoffered payment rails
        run: python scripts/check_pricing.py

      - name: No mojibake in public artifacts
        run: python scripts/check_encoding.py

      # Our own service must never be published under an infrastructure
      # hostname. Founder, 2026-08-30: "I do not want generic urls like these,
      # use hatchloop.dev always." Enforced rather than remembered - the Worker
      # had been stamping its own *.workers.dev address into every discovery
      # document as our identity.
      - name: No generic hostnames in published files
        run: python scripts/check_branding.py

      # We must never advertise a sanctions list we do not screen. Five
      # published surfaces said "OFAC/EU/UN/UK" - including the MCP tool
      # description every agent reads in tools/list - while the UN list was
      # deliberately excluded for want of an open commercial licence. The
      # string was true when written and quietly stopped being true.
      - name: No sanctions coverage we do not have
        run: python scripts/check_sanctions_claims.py

      # THE GENERAL FORM OF THE BUG THAT KEEPS RECURRING: a capability
      # declared in one place and performed nowhere. screen_sanctions accepted
      # a `country` argument, validated it, uppercased it, echoed it into the
      # response as "(country filter: IR)" - and never used it for anything.
      # The published schema promised a filter; the code performed an echo.
      - name: Every advertised parameter does something
        run: python scripts/check_params_do_something.py

      # AND EVERY ADVERTISED PARAMETER MUST REACH THE HANDLER THAT USES IT.
      # The guard above reads the handler, so it passed - green - over eight
      # parameters no caller could deliver, because _dispatch_operation built
      # each request field by field and simply did not list them.
      # `requested_time`, the time being booked, arrived as None on every MCP
      # call ever made while the handler read it in eight places. Documented,
      # modelled, validated, used - and never wired up.
      - name: Every advertised parameter survives dispatch
        run: python scripts/check_params_reach_dispatch.py

      # screen_sanctions.py defined two of its OFAC fetchers TWICE each,
      # byte-identical, a hundred lines apart. Harmless by luck - Python binds
      # the last one and the copies agreed. The danger is the next edit: fix a
      # bug in the first copy, watch every test pass, ship nothing.
      - name: Production Python can parse every file
        # A syntax feature the image's Python lacks fails ONLY in the
        # container, after a green build. This gate makes it fail here.
        run: python scripts/check_py311_compatible.py

      - name: No top-level name defined twice
        run: python scripts/check_no_shadowed_defs.py

      # A count typed by hand is true only on the day it is typed. An audit
      # found "22 jurisdictions" on 15+ surfaces (real: 26 - we were
      # UNDER-claiming our own compliance coverage), plus 12/13/14/18 tools
      # against 20, and a static test badge reading 103/103 that rendered
      # green regardless of whether the suite passed.
      - name: Published counts match reality
        run: python scripts/check_counts.py

      # manifest/mcp_tools.json is the catalogue registry submissions are
      # built from. It was maintained by hand, a sync log flagged it as
      # "Never regenerated" on 2026-08-16, and two weeks later it was still
      # stale at 18 tools against 20 - carrying three capability claims that
      # check_pricing bans everywhere else. It is derived now; this fails if
      # anyone lets it drift again.
      - name: Tool catalogue is derived, not hand-maintained
        run: python scripts/gen_mcp_tools.py --check

      # THE SAME LESSON, ONE LEVEL UP: the manifests that tell the outside world
      # where to reach us were maintained by hand across six files, and on
      # 2026-09-06 they disagreed. server.json said 0.2.12, three door manifests
      # said 0.1.0, two said 0.2.10, and smithery.yaml named a different host
      # from the other five. Every one of them worked, so nobody looked - until
      # a Cloudflare worker was deleted, every hatchloop.dev/mcp/* route 404'd,
      # and two of the three catalogue listings were advertising a dead address
      # while the site root kept answering 200. Drift is not untidiness; it is
      # what makes an outage invisible.
      #
      # registry/servers.yaml is now the only place a server is described, and
      # these two steps are what make that true rather than aspirational.
      # No page may state a tool count as a digit. The founder caught "23 tools"
      # on the page that describes the credit rails for the WHOLE platform - a
      # fact about one product, typed onto a platform surface, in a company being
      # built to run fifty servers. Eight more were found in the same two files
      # once anyone looked. web/facts.py derives them; page() substitutes them;
      # this stops them being typed back.
      - name: No typed tool counts on public pages
        run: python scripts/check_no_typed_counts.py

      - name: Registry reader still reads correctly
        run: python scripts/miniyaml.py

      - name: Manifests are derived from registry/servers.yaml
        run: python scripts/gen_manifests.py --check

      # The MCP registry rejects a description over 100 characters with a 422.
      # I found that out from a red publish job, after the commit was pushed
      # and deployed - every local gate passed because none of them knew the
      # limit existed. It is mirrored locally now.
      - name: Registry manifests within the registry's limits
        run: python scripts/check_registry_limits.py

      # THE GATE FOR THE BUG CLASS THAT HIT NINE TIMES IN ONE DAY: code that is
      # complete, tested, and never invoked. The ninth was found by an external
      # reviewer INSIDE the guard written that morning to catch the class - so
      # vigilance is demonstrably not the answer and this has to be mechanical.
      #
      # Baselined at the 15 modules that were already unreachable, because a new
      # lint that fails on day one gets switched off, and a switched-off gate is
      # how the ninth happened. Its job is to stop the number growing.
      - name: No new unreachable modules
        run: python scripts/check_reachable.py

  smoke:
    name: Post-deploy smoke
    runs-on: ubuntu-latest
    needs: verify
    # Sleeps 120s, then up to five 30s retries. Ten minutes is well clear of
    # the worst honest case and nowhere near the six-hour default.
    timeout-minutes: 10
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      # Carried over from deploy.yml when the two workflows merged. Every step
      # is continue-on-error on purpose: this runs AFTER the deploy, so failing
      # the workflow here would mark a shipped, working build red and teach
      # everyone to ignore the colour. It reports; it does not gate.
      - name: Wait for the deploy to settle
        run: sleep 120

      - name: Production /health
        continue-on-error: true
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS https://api.hatchloop.dev/health; then echo; exit 0; fi
            echo "retry $i..."; sleep 30
          done
          echo "Health check did not pass - verify the Render dashboard."
          exit 0

      # EVERY ADDRESS WE PUBLISH, NOT ONE OF THEM. The step below checks a
      # single endpoint, and on 2026-09-06 that was the shape of the blindness:
      # the deleted worker took out all six MCP routes while the checks we had
      # kept reporting green from somewhere else. This calls every canonical and
      # alias URL in registry/servers.yaml and fails the line if the wrong
      # server answers, not merely if nothing does.
      - name: Every advertised endpoint answers as itself
        continue-on-error: true
        run: python scripts/gen_manifests.py --probe

      - name: Production MCP tools/list
        continue-on-error: true
        run: |
          curl -fsS -X POST https://hatchloop.dev/mcp/agent-broker             -H "Content-Type: application/json"             -d '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' | grep -q "find_business"           && echo "MCP responding correctly"           || echo "MCP smoke did not confirm - check the Render dashboard"

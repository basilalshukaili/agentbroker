<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SMB Broker Dashboard</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0b0d12;
            --surface: #161922;
            --surface-2: #1f2330;
            --text: #e8eaf0;
            --text-muted: #9ba0ad;
            --accent: #6ee7b7;
            --accent-2: #60a5fa;
            --border: #2a2f3d;
            --radius: 12px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.55;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 0;
            border-bottom: 1px solid var(--border);
        }

        nav .brand {
            font-weight: 600;
            letter-spacing: -0.01em;
            font-size: 18px;
        }

        nav ul {
            display: flex;
            gap: 24px;
            list-style: none;
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
            transition: color 0.2s;
        }

        nav a:hover {
            color: var(--text);
        }

        .content {
            padding: 60px 0;
        }

        .section {
            margin-bottom: 60px;
        }

        .section h1 {
            font-size: 40px;
            margin-bottom: 24px;
            letter-spacing: -0.025em;
        }

        .section h2 {
            font-size: 32px;
            margin: 0 0 16px;
            letter-spacing: -0.015em;
        }

        .section p {
            color: var(--text-muted);
            font-size: 16px;
            margin-bottom: 24px;
            line-height: 1.6;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 24px;
            margin: 32px 0;
        }

        .metric-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 32px;
            text-align: center;
            transition: border-color 0.2s;
        }

        .metric-card:hover {
            border-color: var(--text-muted);
        }

        .metric-value {
            font-size: 48px;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 12px;
        }

        .metric-label {
            color: var(--text-muted);
            font-size: 14px;
        }

        .stat-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 18px;
            margin-top: 24px;
        }

        .stat-item {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px;
        }

        .stat-item h3 {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .stat-item .value {
            font-size: 24px;
            font-weight: 600;
            color: var(--accent);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 22px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 500;
            font-size: 15px;
            border: 1px solid transparent;
            transition: all 0.15s;
            cursor: pointer;
        }

        .btn-primary {
            background: var(--accent);
            color: #052e1f;
        }

        .btn-primary:hover {
            background: #5dd6a4;
        }

        .btn-secondary {
            background: transparent;
            border-color: var(--border);
            color: var(--text);
        }

        .btn-secondary:hover {
            border-color: var(--text-muted);
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 18px;
            margin-top: 32px;
        }

        .feature-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            transition: border-color 0.15s;
        }

        .feature-card:hover {
            border-color: var(--text-muted);
        }

        .feature-card h3 {
            margin: 0 0 8px;
            font-size: 17px;
        }

        .feature-card p {
            margin: 0;
            color: var(--text-muted);
            font-size: 14px;
        }

        .pricing-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 24px;
            margin-top: 40px;
        }

        .pricing-card {
            background: var(--surface);
            border: 2px solid var(--border);
            border-radius: var(--radius);
            padding: 32px;
            position: relative;
        }

        .pricing-card.featured {
            border-color: var(--accent);
            transform: scale(1.05);
        }

        .pricing-card h3 {
            font-size: 20px;
            margin-bottom: 12px;
        }

        .pricing-card .price {
            font-size: 36px;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 8px;
        }

        .pricing-card .period {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 24px;
        }

        .pricing-card ul {
            list-style: none;
            margin-bottom: 24px;
        }

        .pricing-card li {
            padding: 8px 0;
            color: var(--text-muted);
            font-size: 14px;
            border-bottom: 1px solid var(--border);
        }

        .pricing-card li:last-child {
            border-bottom: none;
        }

        .pricing-card li::before {
            content: "✓ ";
            color: var(--accent);
            font-weight: 600;
        }

        .loading {
            display: inline-block;
            width: 12px;
            height: 12px;
            background: var(--accent);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        footer {
            padding: 40px 0 60px;
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
            border-top: 1px solid var(--border);
            margin-top: 60px;
        }

        footer a {
            color: var(--text-muted);
            text-decoration: underline;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 720px) {
            nav ul {
                display: none;
            }
            .pricing-card.featured {
                transform: scale(1);
            }
            .section h1 {
                font-size: 28px;
            }
            .metric-value {
                font-size: 36px;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const {useState, useEffect} = React;

        function Dashboard() {
            const [activeTab, setActiveTab] = useState('home');
            const [metrics, setMetrics] = useState({
                total_agents_requested: 0,
                total_businesses_found: 0,
                total_messages_sent: 0,
                total_operations_completed: 0,
            });
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                const fetchMetrics = async () => {
                    try {
                        const response = await fetch('/api/metrics');
                        if (response.ok) {
                            const data = await response.json();
                            setMetrics(data);
                        }
                    } catch (error) {
                        console.error('Failed to fetch metrics:', error);
                    } finally {
                        setLoading(false);
                    }
                };

                fetchMetrics();
                const interval = setInterval(fetchMetrics, 5000);
                return () => clearInterval(interval);
            }, []);

            const renderContent = () => {
                switch (activeTab) {
                    case 'home':
                        return <HomePage metrics={metrics} loading={loading} />;
                    case 'pricing':
                        return <PricingPage />;
                    case 'terms':
                        return <TermsPage />;
                    case 'privacy':
                        return <PrivacyPage />;
                    case 'refund':
                        return <RefundPage />;
                    default:
                        return <HomePage metrics={metrics} loading={loading} />;
                }
            };

            return (
                <>
                    <nav className="container">
                        <div className="brand">SMB Broker</div>
                        <ul>
                            <li>
                                <a onClick={() => setActiveTab('home')} style={{fontWeight: activeTab === 'home' ? '600' : '400'}}>
                                    Dashboard
                                </a>
                            </li>
                            <li>
                                <a onClick={() => setActiveTab('pricing')} style={{fontWeight: activeTab === 'pricing' ? '600' : '400'}}>
                                    Pricing
                                </a>
                            </li>
                            <li>
                                <a onClick={() => setActiveTab('terms')} style={{fontWeight: activeTab === 'terms' ? '600' : '400'}}>
                                    Terms
                                </a>
                            </li>
                            <li>
                                <a onClick={() => setActiveTab('privacy')} style={{fontWeight: activeTab === 'privacy' ? '600' : '400'}}>
                                    Privacy
                                </a>
                            </li>
                            <li>
                                <a onClick={() => setActiveTab('refund')} style={{fontWeight: activeTab === 'refund' ? '600' : '400'}}>
                                    Refunds
                                </a>
                            </li>
                        </ul>
                    </nav>

                    <div className="container content">
                        {renderContent()}
                    </div>

                    <footer className="container">
                        <p>© 2026 SMB Broker. All rights reserved. | <a href="https://smb-broker.onrender.com/health">Status</a></p>
                    </footer>
                </>
            );
        }

        function HomePage({metrics, loading}) {
            return (
                <div className="section">
                    <h1>SMB Broker Dashboard</h1>
                    <p>Real-time metrics for agent-powered business interactions</p>

                    <div className="metrics-grid">
                        <div className="metric-card">
                            <div className="metric-value">
                                {loading ? <span className="loading"></span> : metrics.total_agents_requested}
                            </div>
                            <div className="metric-label">Agents Requested</div>
                        </div>
                        <div className="metric-card">
                            <div className="metric-value">
                                {loading ? <span className="loading"></span> : metrics.total_businesses_found}
                            </div>
                            <div className="metric-label">Businesses Found</div>
                        </div>
                        <div className="metric-card">
                            <div className="metric-value">
                                {loading ? <span className="loading"></span> : metrics.total_messages_sent}
                            </div>
                            <div className="metric-label">Messages Sent</div>
                        </div>
                        <div className="metric-card">
                            <div className="metric-value">
                                {loading ? <span className="loading"></span> : metrics.total_operations_completed}
                            </div>
                            <div className="metric-label">Operations Completed</div>
                        </div>
                    </div>

                    <div className="section" style={{marginTop: '60px'}}>
                        <h2>What is SMB Broker?</h2>
                        <p>
                            SMB Broker is a horizontal MCP server that provides AI agents with the ability to find, verify, message, and schedule appointments with small and mid-sized businesses worldwide. Built with TCPA, GDPR, and CASL compliance standards from the ground up.
                        </p>

                        <h2 style={{marginTop: '40px'}}>Key Features</h2>
                        <div className="features-grid">
                            <div className="feature-card">
                                <h3>🌐 Global Coverage</h3>
                                <p>Access millions of SMBs worldwide with local compliance standards</p>
                            </div>
                            <div className="feature-card">
                                <h3>🔐 Compliance Built In</h3>
                                <p>TCPA, GDPR, and CASL compliance automatically enforced</p>
                            </div>
                            <div className="feature-card">
                                <h3>⚡ Real-Time Verification</h3>
                                <p>Instant business verification and contact validation</p>
                            </div>
                            <div className="feature-card">
                                <h3>📞 Multi-Channel</h3>
                                <p>SMS, Email, Voice, Web Forms — reach businesses how they prefer</p>
                            </div>
                            <div className="feature-card">
                                <h3>📅 Smart Scheduling</h3>
                                <p>Intelligent appointment scheduling with timezone handling</p>
                            </div>
                            <div className="feature-card">
                                <h3>💰 Pay-As-You-Go</h3>
                                <p>Free tier available. Scale pricing as you grow</p>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function PricingPage() {
            return (
                <div className="section">
                    <h1>Pricing</h1>
                    <p>Simple, transparent pricing. Start free, pay only for what you use.</p>

                    <div className="pricing-grid">
                        <div className="pricing-card">
                            <h3>Starter</h3>
                            <div className="price">Free</div>
                            <div className="period">Forever</div>
                            <ul>
                                <li>100 businesses/month</li>
                                <li>Verify business information</li>
                                <li>Basic SMS (Twilio trial)</li>
                                <li>Community support</li>
                                <li>MCP discovery</li>
                            </ul>
                            <button className="btn btn-secondary">Get Started</button>
                        </div>

                        <div className="pricing-card featured">
                            <h3>Professional</h3>
                            <div className="price">$49</div>
                            <div className="period">per month</div>
                            <ul>
                                <li>10,000 businesses/month</li>
                                <li>Priority verification</li>
                                <li>Unlimited messaging</li>
                                <li>Email & SMS</li>
                                <li>Priority email support</li>
                                <li>Advanced analytics</li>
                            </ul>
                            <button className="btn btn-primary">Start Free Trial</button>
                        </div>

                        <div className="pricing-card">
                            <h3>Enterprise</h3>
                            <div className="price">Custom</div>
                            <div className="period">contact sales</div>
                            <ul>
                                <li>Unlimited operations</li>
                                <li>White-label solutions</li>
                                <li>Dedicated support</li>
                                <li>Custom integrations</li>
                                <li>SLA guarantees</li>
                                <li>Compliance audit</li>
                            </ul>
                            <button className="btn btn-secondary">Contact Sales</button>
                        </div>
                    </div>

                    <div style={{marginTop: '60px', padding: '32px', background: 'var(--surface)', borderRadius: 'var(--radius)', border: '1px solid var(--border)'}}>
                        <h2>FAQ</h2>
                        <div style={{marginTop: '24px'}}>
                            <h3 style={{color: 'var(--accent)', marginTop: '16px'}}>Do you offer a free tier?</h3>
                            <p>Yes! The Starter plan is completely free forever with up to 100 businesses per month. Perfect for testing the platform.</p>

                            <h3 style={{color: 'var(--accent)', marginTop: '16px'}}>Can I upgrade or downgrade anytime?</h3>
                            <p>Yes. Changes take effect immediately and we'll prorate any charges or credits automatically.</p>

                            <h3 style={{color: 'var(--accent)', marginTop: '16px'}}>What payment methods do you accept?</h3>
                            <p>We accept all major credit cards, PayPal, and bank transfers for Enterprise customers.</p>

                            <h3 style={{color: 'var(--accent)', marginTop: '16px'}}>Is there a contract?</h3>
                            <p>No contracts. You can cancel anytime. For Enterprise plans, we offer flexible terms.</p>
                        </div>
                    </div>
                </div>
            );
        }

        function TermsPage() {
            return (
                <div className="section">
                    <h1>Terms of Service</h1>
                    <p>Last updated: April 29, 2026</p>

                    <div style={{marginTop: '40px', lineHeight: '1.8'}}>
                        <h2>1. Acceptance of Terms</h2>
                        <p>By accessing or using SMB Broker ("Service"), you agree to be bound by these Terms of Service. If you do not agree to all the terms and conditions, you may not access or use the Service.</p>

                        <h2>2. Description of Service</h2>
                        <p>SMB Broker is a Model Context Protocol (MCP) server that provides AI agents with tools to find, verify, message, and schedule appointments with small and mid-sized businesses. The Service is offered on an "as-is" basis.</p>

                        <h2>3. Eligibility</h2>
                        <p>You must be at least 18 years old to use this Service. By using the Service, you represent and warrant that you meet this requirement.</p>

                        <h2>4. User Responsibilities</h2>
                        <p>You are responsible for:</p>
                        <ul style={{marginLeft: '20px', marginBottom: '16px'}}>
                            <li>Maintaining the confidentiality of your API credentials</li>
                            <li>All activities that occur under your account</li>
                            <li>Compliance with all applicable laws and regulations</li>
                            <li>Ensuring your use complies with TCPA, GDPR, CASL, and other privacy regulations</li>
                        </ul>

                        <h2>5. Compliance Requirements</h2>
                        <p>You acknowledge that the Service is subject to telecommunications and privacy regulations including but not limited to:</p>
                        <ul style={{marginLeft: '20px', marginBottom: '16px'}}>
                            <li>Telephone Consumer Protection Act (TCPA)</li>
                            <li>General Data Protection Regulation (GDPR)</li>
                            <li>Canadian Anti-Spam Legislation (CASL)</li>
                            <li>Other applicable regional privacy and telecommunications laws</li>
                        </ul>
                        <p>You agree to comply with all such regulations and indemnify us against any claims arising from your non-compliance.</p>

                        <h2>6. Prohibited Uses</h2>
                        <p>You agree not to use the Service to:</p>
                        <ul style={{marginLeft: '20px', marginBottom: '16px'}}>
                            <li>Violate any applicable law or regulation</li>
                            <li>Infringe on intellectual property rights of others</li>
                            <li>Transmit unsolicited communications or spam</li>
                            <li>Harass, threaten, or abuse any person</li>

                        <p>The Service and all content, features, and functionality are owned by SMB Broker, its licensors, or other providers of such material and are protected by United States and international copyright, trademark, and other intellectual property laws.</p>

                        <p>You agree to indemnify and hold harmless SMB Broker from any claims, damages, or costs arising from your use of the Service, including attorney's fees, that result from your violation of these Terms or applicable laws.</p>

                        <h2>10. Termination</h2>
                        <p>We may terminate or suspend your access to the Service at any time for violation of these Terms or for any other reason, with or without notice.</p>

                        <h2>11. Changes to Terms</h2>
                        <p>We reserve the right to modify these Terms at any time. Your continued use of the Service following the posting of revised Terms means that you accept and agree to the changes.</p>

                        <h2>12. Contact Us</h2>
                        <p>If you have questions about these Terms, please contact us at support@smb-broker.onrender.com</p>
                    </div>
                </div>
            );
        }

        function PrivacyPage() {
            return (
                <div className="section">
                    <h1>Privacy Policy</h1>
                    <p>Last updated: April 29, 2026</p>

                    <div style={{marginTop: '40px', lineHeight: '1.8'}}>
                        <h2>1. Introduction</h2>
                        <p>SMB Broker ("we" or "us") is committed to protecting your privacy. This Privacy Policy explains how we collect, use, disclose, and safeguard your information when you use our Service.</p>

                        <h2>2. Information We Collect</h2>
                        <p>We collect information in the following ways:</p>
                        <ul style={{marginLeft: '20px', marginBottom: '16px'}}>
                            <li><strong>API Credentials:</strong> Your API keys and authentication tokens</li>
                            <li><strong>Service Usage Data:</strong> Information about how you use the Service, including operations performed</li>
                            <li><strong>Device Information:</strong> IP address, browser type, and operating system</li>
                            <li><strong>Business Data:</strong> Information about businesses your agents interact with (collected on behalf of agents)</li>
                        </ul>

                        <h2>3. Use of Information</h2>
                        <p>We use the information we collect for the following purposes:</p>
                        <ul style={{marginLeft: '20px', marginBottom: '16px'}}>
                            <li>Providing and maintaining the Service</li>
                            <li>Billing and payment processing</li>
                            <li>Detecting and preventing fraud or abuse</li>
                            <li>Compliance with legal obligations</li>
                            <li>Analytics and service improvement</li>
                        </ul>

                        <h2>4. Data Storage and Security</h2>
                        <p>We employ industry-standard security measures to protect your information against unauthorized access, alteration, disclosure, or destruction. Data is encrypted in transit and at rest.</p>

                        <h2>5. Third-Party Sharing</h2>
                        <p>We do not sell or rent your personal information. We may share information with:</p>

                            <li>Service providers who assist us in operating the Service</li>
                            <li>Legal authorities when required by law</li>
                            <li>Your designated agents and business partners</li>
                        </ul>

                        <p>We retain your data for as long as necessary to provide the Service and comply with legal obligations. You can request deletion of your data subject to legal requirements.</p>

                        <h2>7. Your Rights</h2>
                        <p>You have the right to:</p>
                        <ul style={{marginLeft: '20px', marginBottom: '16px'}}>
                            <li>Access your personal data</li>
                            <li>Correct inaccurate data</li>

                            <li>Opt-out of marketing communications</li>

                        <p>For users in the European Union, we comply with the General Data Protection Regulation (GDPR). Your data processing is lawful based on our legitimate business interests and contractual obligations.</p>

                        <p>For California residents, we comply with the California Consumer Privacy Act (CCPA) regarding personal information rights and disclosures.</p>

                        <h2>12. Contact Us</h2>
                        <p>If you have questions about this Privacy Policy or our privacy practices, please contact us at privacy@smb-broker.onrender.com</p>
                    </div>
                </div>

        }

        function RefundPage() {
            return (
                <div className="section">
                    <h1>Refund Policy</h1>
                    <p>Last updated: April 29, 2026</p>

                    <div style={{marginTop: '40px', lineHeight: '1.8'}}>
                        <h2>1. Refund Eligibility</h2>
                        <p>We offer refunds for monthly subscription charges under the following conditions:</p>
                        <ul style={{marginLeft: '20px', marginBottom: '16px'}}>
                            <li>Refund requests must be submitted within 30 days of the charge date</li>
                            <li>The Service was not used to its intended purpose (e.g., unused trial period)</li>
                            <li>There was a billing error on our part</li>
                            <li>The Service was unavailable for more than 24 hours</li>
                        </ul>

                        <h2>2. Non-Refundable Items</h2>
                        <p>The following are non-refundable:</p>
                        <ul style={{marginLeft: '20px', marginBottom: '16px'}}>
                            <li>Usage-based charges for API calls or operations</li>
                            <li>Months where the Service was actively used</li>
                            <li>Refund requests submitted after 30 days</li>
                            <li>Charges resulting from user error</li>
                            <li>Custom development or consultation services</li>
                        </ul>

                        <h2>3. Free Trial</h2>
                        <p>The free trial is provided at no cost and ends automatically after the trial period. If you are charged during the trial period without authorization, please contact us immediately for a refund.</p>

                        <h2>4. Refund Process</h2>

  authentication:
    type: bearer
    header: X-Agent-Identity
    description: "100 ops/IP/day free — no key required. For unlimited access, subscribe at https://buy.polar.sh/polar_cl_zRn6I67zMjFuenkjDme5RCnDYmA3vefHqX1zG3A5Phh ($49/mo flat, no per-call billing). Key arrives by email; send as X-Agent-Identity header. All 8 read tools always free."

tools:
  - name: find_business
    description: "Search SMBs by vertical + location + capability"
  - name: verify_business
    description: "Confirm an SMB has a specific capability"
  - name: send_message
    description: "Send SMS / email / voice with full compliance pre-check"
  - name: capture_lead
    description: "Hand off a prospect to an SMB with dedup"
  - name: schedule_appointment
    description: "Book / reschedule / cancel via Cal.com → voice fallback"
  - name: send_transactional_confirmation
    description: "TCPA-exempt transactional confirmations (booking / receipt)"
  - name: handle_inbound
    description: "Classify customer messages (booking / cancel / opt-out / question)"
  - name: escalate_to_human
    description: "Hand off to a human when the agent is stuck"
  - name: get_status
    description: "Poll status of an async operation"
  - name: get_outcome
    description: "Retrieve final outcome of an async operation"
  - name: preview_cost
    description: "Free cost / latency / success-probability estimate"
  - name: self_test
    description: "Free service health check"
  - name: import_booking_url
    description: "Turn any public booking URL into a structured booking object"
  - name: call_business
    description: "Place a voice-AI phone call to a business on behalf of an agent"
  - name: check_booking_link
    description: "Free pre-flight: classify a booking URL before spending on import_booking_url"
  - name: check_compliance
    description: "Free pre-flight: preview the TCPA/GDPR/CASL compliance gate before spending on send_message"


# tolerate your own prose is how guards die; the exemption list in that script
# already carries a warning about exactly that.)
#
# WHAT MAKES THAT WORTH A COMMENT: three gates scanned this file - check_counts,
# check_branding, check_sanctions_claims - and all three reported it clean. They
# were looking for the word "tools" and it said "operations". A guard is only as
# wide as its vocabulary, and a guard that inspects a file without understanding
# it is worse than no guard, because it certifies the file. `operations` is a
# guarded noun in check_counts as of today, which is how this was found.
#
# WHAT REPLACED IT: ../../smithery.yaml at the repository root, GENERATED by

name: agent-broker
displayName: "Agent Broker — SMB Transactions & Bookings"
# DEPLOY GAP (2026-08-16): the two newest tools (check_booking_link,
# check_compliance) are merged in manifest/manifest.json but NOT yet live on
# either Cloudflare edge or the Render origin -- both still answer tools/list
# with 20 tools as of this writing. Trigger a fresh Render deploy + confirm the
# edge snapshot (edge/src/snapshots/mcp-tools-list.json, manifest/mcp_tools.json)
# is regenerated BEFORE claiming 16 anywhere public (this file included). See
# deploy/registry-submissions/smithery-sync-2026-08-16.md for the full audit.
description: >
  Agent-callable horizontal layer for finding, verifying, booking, messaging, and
  calling long-tail small/mid-sized businesses worldwide. 20 operations across 12
  booking platforms (Cal.com, Calendly, Doctolib, Booksy, Fresha, OpenTable,
  Setmore, Square, Acuity, Schedulista, Squarespace, BookMyCity), plus free
  pre-flight checks for booking links, outbound-message compliance, company
  registry verification (GLEIF + SEC EDGAR), live sanctions screening (OFAC
  SDN + OpenSanctions covering EU, UN, UK, and 40+ official lists), and
  cross-border trade compliance (OFAC embargo map + party sanctions + tariff
  guidance). Built-in compliance gate (TCPA / GDPR / CASL / PDPL across 22
  jurisdictions). 11 read tools always free (100 ops/IP/day free tier) -- 8
  write tools need a free email-verified key (50 ops/day) or credits.

vendor: agent-broker-edge.techmate.workers.dev
homepage: https://agent-broker-edge.techmate.workers.dev
repository: https://github.com/basilalshukaili/agentbroker
license: proprietary

categories:
  - business
  - automation
  - scheduling
  - messaging
  - compliance

tags:
  - mcp
  - smb
  - business-automation
  - scheduling
  - cal.com
  - twilio
  - vapi
  - voice-ai
  - sms
  - compliance
  - tcpa
  - gdpr

connection:
  type: http
  # CANONICAL target (rate-limited, founder-controlled Cloudflare account
  # lordbasil147@gmail.com). The LIVE Smithery listing still points at the
  # OLD edge (agent-broker-edge.basil-agent.workers.dev, different Cloudflare
  # account, credentials unknown) -- see smithery-sync-2026-08-16.md founder
  # gate "agentbroker-smithery-url" for the fix.
  url: https://agent-broker-edge.techmate.workers.dev/mcp
  authentication:
    type: bearer
    header: X-Agent-Identity
    description: "11 read tools are always free with no key. Write tools need a free email-verified key (50 ops/day) from https://hatchloop.dev/agent-broker, or credits from https://hatchloop.dev/pricing (Starter $9/1,000 credits); agents may also pay per-call via x402. Send the key as the X-Agent-Identity header."

tools:
  - name: find_business
    description: "Search SMBs by vertical + location + capability"
  - name: verify_business
    description: "Confirm an SMB has a specific capability"
  - name: send_message
    description: "Send WhatsApp / SMS / email / voice with full compliance pre-check (WhatsApp free during launch)"
  - name: capture_lead
    description: "Hand off a prospect to an SMB with dedup"
  - name: schedule_appointment
    description: "Book / reschedule / cancel via Cal.com → voice fallback"
  - name: send_transactional_confirmation
    description: "TCPA-exempt transactional confirmations (booking / receipt)"
  - name: handle_inbound
    description: "Classify customer messages (booking / cancel / opt-out / question)"
  - name: escalate_to_human
    description: "Hand off to a human when the agent is stuck"
  - name: get_status
    description: "Poll status of an async operation"
  - name: get_outcome
    description: "Retrieve final outcome of an async operation"
  - name: preview_cost
    description: "Free cost / latency / success-probability estimate"
  - name: self_test
    description: "Free service health check"
  - name: import_booking_url
    description: "Turn any public booking URL into a structured booking object"
  - name: call_business
    description: "Place a voice-AI phone call to a business on behalf of an agent"
  - name: check_booking_link
    description: "Free pre-flight: classify a booking URL before spending on import_booking_url"
  - name: check_compliance
    description: "Free pre-flight: preview the TCPA/GDPR/CASL compliance gate before spending on send_message"
  - name: verify_company_record
    description: "Free live registry lookup: verify a company exists and return its official GLEIF LEI / SEC EDGAR record"
  - name: screen_sanctions
    description: "Free live sanctions screening: check a name/entity against OFAC SDN, EU, UN, UK, and 40+ official watchlists via OpenSanctions"
  - name: map_trade_restriction
    description: "Free cross-border trade compliance snapshot: OFAC embargo map + party sanctions screening + tariff guidance links for any product + destination"


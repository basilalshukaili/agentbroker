description: >
  Agent-callable horizontal layer for finding, verifying, booking, messaging, and
  calling long-tail small/mid-sized businesses worldwide. 16 operations across 12
  booking platforms (Cal.com, Calendly, Doctolib, Booksy, Fresha, OpenTable,
  Setmore, Square, Acuity, Schedulista, Squarespace, BookMyCity), plus free
  pre-flight checks for booking links and outbound-message compliance. Built-in
  compliance gate (TCPA / GDPR / CASL / PDPL across 22 jurisdictions). 8 read
  tools always free (100 ops/IP/day free tier) — 8 write tools need a $49/mo
  developer key (no per-call billing, flat access).


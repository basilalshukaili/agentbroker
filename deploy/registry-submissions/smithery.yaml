# Smithery MCP server registry entry.
# Submit this file via PR to https://github.com/smithery-ai/registry
# Or paste the contents into the Smithery web form: https://smithery.ai/server/new

name: agent-broker
displayName: "Agent Broker — SMB Transactions & Bookings"
description: >
  Agent-callable horizontal layer for finding, verifying, booking, and messaging
  long-tail small/mid-sized businesses worldwide. 13 operations across 12 booking
  platforms (Cal.com, Calendly, Doctolib, Booksy, Fresha, OpenTable, Setmore,
  Square, Acuity, Schedulista, Squarespace, BookMyCity). Built-in compliance
  gate (TCPA / GDPR / CASL / PDPL across 22 jurisdictions). Pay-per-call via
  x402 USDC-on-Base micropayments — no signup, no card.

vendor: agent-broker-edge.basil-agent.workers.dev
homepage: https://agent-broker-edge.basil-agent.workers.dev
repository: https://github.com/basilalshukaili/agentbroker
license: proprietary

categories:
  - business
  - automation
  - scheduling
  - messaging
  - compliance

tags:
  - mcp
  - smb
  - business-automation
  - scheduling
  - cal.com
  - twilio
  - vapi
  - voice-ai
  - sms
  - compliance
  - tcpa
  - gdpr

connection:
  type: http
  url: https://agent-broker-edge.basil-agent.workers.dev/mcp
  authentication:
    type: bearer
    header: X-Agent-Identity
    description: "JWT token issued by /auth/token endpoint"

tools:
  - name: find_business
    description: "Search SMBs by vertical + location + capability"
  - name: verify_business
    description: "Confirm an SMB has a specific capability"
  - name: send_message
    description: "Send SMS / email / voice with full compliance pre-check"
  - name: capture_lead
    description: "Hand off a prospect to an SMB with dedup"
  - name: schedule_appointment
    description: "Book / reschedule / cancel via Cal.com → voice fallback"
  - name: send_transactional_confirmation
    description: "TCPA-exempt transactional confirmations (booking / receipt)"
  - name: handle_inbound
    description: "Classify customer messages (booking / cancel / opt-out / question)"
  - name: escalate_to_human
    description: "Hand off to a human when the agent is stuck"
  - name: get_status
    description: "Poll status of an async operation"
  - name: get_outcome
    description: "Retrieve final outcome of an async operation"
  - name: preview_cost
    description: "Free cost / latency / success-probability estimate"
  - name: self_test
    description: "Free service health check"

screenshots:
  - url: https://agent-broker-edge.basil-agent.workers.dev/static/screenshot-1.png
    caption: "MCP tools surface in Claude Desktop"
  - url: https://agent-broker-edge.basil-agent.workers.dev/static/screenshot-2.png
    caption: "Live booking via Cal.com integration"

documentation:
  - url: https://agent-broker-edge.basil-agent.workers.dev/docs
    type: getting_started
  - url: https://agent-broker-edge.basil-agent.workers.dev/.well-known/mcp.json
    type: mcp_descriptor
  - url: https://agent-broker-edge.basil-agent.workers.dev/llms.txt
    type: llms_txt

pricing:
  free_tier: "100 ops/month free for any agent"
  paid_tiers: "Developer $49/mo, Business $499/mo, Enterprise negotiated"
  outcome_pricing: "schedule_appointment: $0.15 base + $0.85 success premium"

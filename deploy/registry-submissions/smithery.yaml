name: agent-broker
displayName: "Agent Broker — SMB Transactions & Bookings"
description: >
  Agent-callable horizontal layer for finding, verifying, booking, messaging, and
  calling long-tail small/mid-sized businesses worldwide. 14 operations across 12
  booking platforms (Cal.com, Calendly, Doctolib, Booksy, Fresha, OpenTable,
  Setmore, Square, Acuity, Schedulista, Squarespace, BookMyCity). Built-in
  compliance gate (TCPA / GDPR / CASL / PDPL across 22 jurisdictions). 6 read
  tools always free — 8 write tools need a $9/90-day developer key (no per-call
  billing, flat access).

vendor: agent-broker-edge.techmate.workers.dev
homepage: https://agent-broker-edge.techmate.workers.dev
repository: https://github.com/basilalshukaili/agentbroker
license: proprietary

categories:
  - business
  - automation
  - scheduling
  - messaging
  - compliance

